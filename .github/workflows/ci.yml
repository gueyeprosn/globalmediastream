name: CI

on:
  push:
    branches: [main]
    paths:
      - "tv-radio-app/**"
  pull_request:
    paths:
      - "tv-radio-app/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-radio-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tv-radio-app/package-lock.json
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
