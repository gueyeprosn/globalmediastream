# Exemple : bloc à fusionner dans /etc/nginx/sites-available/stream.broadcastsn.com
# (à côté du location existant pour /toubatv/ ou le flux HLS)
#
# HTTPS déjà configuré (Let's Encrypt) pour stream.broadcastsn.com

server {
    listen 443 ssl http2;
    server_name stream.broadcastsn.com;

    # ... vos certificats SSL existants ...
    # ssl_certificate     /etc/letsencrypt/live/stream.broadcastsn.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/stream.broadcastsn.com/privkey.pem;

    # --- Flux HLS / streaming existant (ne pas supprimer) ---
    # location /toubatv/ { ... }

    # --- TOUBA TV Admin + vMix XML ---
    include /etc/nginx/snippets/appttv.conf;
}

server {
    listen 80;
    server_name stream.broadcastsn.com;
    return 301 https://$host$request_uri;
}
