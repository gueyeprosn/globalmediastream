# TOUBA TV — admin + vMix XML
# Inclure dans le server HTTPS de stream.broadcastsn.com :
#   include /etc/nginx/snippets/appttv.conf;
#
# Copie sur le VPS :
#   sudo cp deploy/nginx-includes/appttv.conf /etc/nginx/snippets/appttv.conf

# Redirection sans slash final
location = /appttv {
    return 301 https://$host/appttv/;
}

# Admin web + API + XML vMix
location /appttv/ {
    proxy_pass http://127.0.0.1:3010/appttv/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Pas de cache (modération + XML vMix temps réel)
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
