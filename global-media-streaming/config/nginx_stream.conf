# ============================================================================
# Configuration Nginx pour Global Media Streaming
# Domain: stream.broadcastsn.com
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name stream.broadcastsn.com;

    # Redirection HTTP vers HTTPS
    return 301 https://$server_name$request_uri;

    # Root pour le site web principal
    root /var/www/globalmedia;
    index index.html index.htm;

    # Logs
    access_log /var/log/nginx/stream_access.log;
    error_log /var/log/nginx/stream_error.log;

    # Proxy pour Icecast2 (OceanFM)
    location /oceanfm {
        proxy_pass http://127.0.0.1:8000/oceanfm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers pour le streaming - optimisés pour stabilité
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # CORS pour les lecteurs web
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    }

    # Proxy pour l'admin Icecast2
    location = /admin {
        return 301 /admin/;
    }
    
    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_buffering off;
        proxy_redirect off;
    }
    
    # Proxy pour les fichiers statiques d'Icecast (style.css, status.xsl, etc.)
    location ~ ^/(style\.css|status\.xsl|favicon\.ico|admin/.*\.xsl)$ {
        proxy_pass http://127.0.0.1:8000$request_uri;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # Alias pour ToubaTV HLS (direct — pas de cache agressif ni gzip sur .m3u8 : évite coupures lecteur)
    location /toubatv/ {
        alias /srv/toubatv/hls/;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Range' always;
        
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        
        expires -1;
        gzip off;
    }

    # Alias pour External TV HLS
    location /external-tv/ {
        alias /srv/external-tv/hls/;
        
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Range';
        
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        
        expires -1;

    }

    # Fichiers playlist .m3u pour les streams radio (AVANT Next.js)
    location ~ ^/(oceanfm|external-radio)\.m3u$ {
        root /srv/tv-radio-app/public;
        default_type audio/x-mpegurl;
        add_header Content-Type "audio/x-mpegurl; charset=utf-8";
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=3600";
        expires 1h;
        try_files $uri =404;
    }

    # Fichiers statiques Next.js
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images optimisées Next.js
    location /_next/image {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy pour l'application Next.js Ocean FM
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # HTML / RSC : pas de cache agressif (évite références obsolètes vers /_next/static/chunks)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
    }

    # Sécurité
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stream.broadcastsn.com;

    # Certificats SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/stream.broadcastsn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stream.broadcastsn.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/stream.broadcastsn.com/chain.pem;

    # Configuration SSL moderne
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Root pour le site web principal
    root /var/www/globalmedia;
    index index.html index.htm;

    # Logs
    access_log /var/log/nginx/stream_ssl_access.log;
    error_log /var/log/nginx/stream_ssl_error.log;

    # Favicon app Next.js (évite 404 sur /favicon.ico)
    location = /favicon.ico {
        alias /srv/tv-radio-app/public/icon.svg;
        add_header Content-Type "image/svg+xml";
        add_header Cache-Control "public, max-age=86400";
